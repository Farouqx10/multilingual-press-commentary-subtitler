<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-ATLaS Caption Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1216;
    --panel:#171C22;
    --panel-2:#1D242C;
    --line:#2A323C;
    --text:#E8ECEF;
    --text-dim:#8A93A0;
    --teal:#2DD9C4;
    --amber:#FF9640;
    --red:#FF5C5C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #151B21 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);}
  h1{font-size:19px;font-weight:600;letter-spacing:0.01em;margin:0;}
  .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);border:1px solid var(--line);border-radius:20px;padding:5px 12px;letter-spacing:0.04em;}

  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }

  .setup{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:14px;align-items:end;margin-bottom:18px;}
  @media (max-width:760px){.setup{grid-template-columns:1fr 1fr;}}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:6px;}
  .field select, .field input[type=file]{
    width:100%;background:#11151A;border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;
  }
  .field.check{display:flex;align-items:center;gap:8px;padding-bottom:8px;}
  .field.check input{accent-color:var(--teal);width:15px;height:15px;}
  .field.check label{margin:0;font-size:12.5px;color:var(--text);text-transform:none;letter-spacing:0;}

  button{
    background:var(--teal);color:#06201C;border:none;border-radius:7px;
    font-weight:600;font-size:13.5px;padding:10px 18px;cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(0.98);}
  button:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}

  .stage{display:none;margin-top:22px;}
  .stage.active{display:block;}

  .status-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 1.3s infinite ease-in-out;}
  .status-dot.done{background:var(--teal);animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stage-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;}
  @media (max-width:820px){.stage-grid{grid-template-columns:1fr;}}

  .video-frame{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;border:1px solid var(--line);}
  video{display:block;width:100%;max-height:480px;background:#000;}
  .cap-overlay{
    position:absolute;left:6%;right:6%;bottom:8%;text-align:center;pointer-events:none;
    display:flex;flex-direction:column;gap:4px;
  }
  .cap-line{
    display:inline-block;align-self:center;
    background:rgba(6,10,14,0.72);backdrop-filter:blur(2px);
    color:#fff;font-weight:600;font-size:16px;line-height:1.3;
    padding:5px 12px;border-radius:5px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .cap-line.translated{font-weight:500;color:var(--teal);font-size:14px;}

  .ruler-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);
    display:flex;justify-content:space-between;margin:10px 2px 4px;letter-spacing:0.03em;}
  .ruler{position:relative;height:9px;border-radius:5px;background:#11151A;border:1px solid var(--line);overflow:hidden;}
  .ruler-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--teal),#54F0DB);width:0%;transition:width .3s ease;}
  .ruler-playhead{position:absolute;top:-3px;width:2px;height:15px;background:var(--amber);left:0%;box-shadow:0 0 6px var(--amber);}

  .log{
    background:#11151A;border:1px solid var(--line);border-radius:var(--radius);
    height:480px;overflow-y:auto;padding:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  }
  .log-title{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--text-dim);margin-bottom:10px;}
  .log-item{padding:9px 0;border-bottom:1px solid var(--line);}
  .log-item:last-child{border-bottom:none;}
  .log-time{color:var(--amber);}
  .log-native{color:var(--text);margin-top:3px;}
  .log-translated{color:var(--teal);margin-top:2px;}
  .log-empty{color:var(--text-dim);font-style:italic;}

  .error{color:var(--red);font-size:12.5px;margin-top:10px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>N-ATLaS Caption Desk</h1>
        <div class="sub">Nigerian-language ASR &amp; translation, captions filling in as they're generated</div>
      </div>
    </div>
    <span class="tag">HAUSA · YORUBA · IGBO · NG-ENGLISH</span>
  </header>

  <div class="panel">
    <div class="setup">
      <div class="field">
        <label for="fileInput">Video file</label>
        <input type="file" id="fileInput" accept="video/*">
      </div>
      <div class="field">
        <label for="sourceLang">Spoken language</label>
        <select id="sourceLang">
          <option>Hausa</option>
          <option>Yoruba</option>
          <option>Igbo</option>
          <option selected>Nigerian English</option>
        </select>
      </div>
      <div class="field">
        <label for="targetLang">Translate to</label>
        <select id="targetLang">
          <option selected>English</option>
          <option>Hausa</option>
          <option>Yoruba</option>
          <option>Igbo</option>
        </select>
      </div>
      <button id="startBtn" disabled>▶ Start captioning</button>
    </div>
    <div class="field check">
      <input type="checkbox" id="translateToggle" checked>
      <label for="translateToggle">Show translated line under native caption</label>
    </div>
    <div id="errorBox" class="error"></div>
  </div>

  <div class="stage" id="stage">
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">CONNECTING…</span>
    </div>

    <div class="stage-grid">
      <div>
        <div class="video-frame">
          <video id="video" controls playsinline></video>
          <div class="cap-overlay" id="capOverlay"></div>
        </div>
        <div class="ruler-label"><span>CAPTION AVAILABILITY</span><span id="rulerPct">0%</span></div>
        <div class="ruler">
          <div class="ruler-fill" id="rulerFill"></div>
          <div class="ruler-playhead" id="rulerPlayhead"></div>
        </div>
      </div>

      <div class="log">
        <div class="log-title">Live transcript log</div>
        <div id="logList"><div class="log-empty">Waiting for the first caption…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const startBtn = document.getElementById('startBtn');
const stage = document.getElementById('stage');
const video = document.getElementById('video');
const capOverlay = document.getElementById('capOverlay');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const rulerFill = document.getElementById('rulerFill');
const rulerPct = document.getElementById('rulerPct');
const rulerPlayhead = document.getElementById('rulerPlayhead');
const logList = document.getElementById('logList');
const errorBox = document.getElementById('errorBox');
const sourceLang = document.getElementById('sourceLang');
const targetLang = document.getElementById('targetLang');
const translateToggle = document.getElementById('translateToggle');

let captions = [];   // {start, end, native, translated}
let videoDuration = 0;
let done = false;
let bufferedUntil = 0;      // furthest time we have a caption for
let hasStartedPlayback = false;
let autoPaused = false;     // paused by us (buffering), not by the user

fileInput.addEventListener('change', () => {
  startBtn.disabled = !fileInput.files.length;
});

function fmtTime(s){
  s = Math.max(0, s || 0);
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function addLogEntry(cap){
  if (logList.querySelector('.log-empty')) logList.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'log-item';
  const translatedHtml = cap.translated ? `<div class="log-translated">${cap.translated}</div>` : '';
  div.innerHTML = `<span class="log-time">${fmtTime(cap.start)}</span>
    <div class="log-native">${cap.native || '(silence)'}</div>${translatedHtml}`;
  logList.appendChild(div);
  logList.scrollTop = logList.scrollHeight;
}

function updateRuler(){
  if (!videoDuration) return;
  const lastEnd = captions.length ? captions[captions.length-1].end : 0;
  const pct = Math.min(100, (lastEnd / videoDuration) * 100);
  rulerFill.style.width = pct.toFixed(1) + '%';
  rulerPct.textContent = Math.round(pct) + '%';
}

video.addEventListener('timeupdate', () => {
  if (videoDuration) {
    rulerPlayhead.style.left = Math.min(100, (video.currentTime/videoDuration)*100) + '%';
  }
  const t = video.currentTime;
  const active = captions.find(c => t >= c.start && t < c.end);
  if (active) {
    let html = `<span class="cap-line">${active.native || ''}</span>`;
    if (translateToggle.checked && active.translated) {
      html += `<span class="cap-line translated">${active.translated}</span>`;
    }
    capOverlay.innerHTML = html;
  } else {
    capOverlay.innerHTML = '';
  }
  if (!done && hasStartedPlayback && !video.paused && t >= bufferedUntil - 0.15) {
    video.pause();
    autoPaused = true;
    statusText.textContent = 'BUFFERING — waiting for captions to catch up…';
  }
});

video.addEventListener('loadedmetadata', () => {
  videoDuration = video.duration;
  updateRuler();
});

startBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  errorBox.textContent = '';
  startBtn.disabled = true;
  startBtn.textContent = 'Uploading…';

  video.src = URL.createObjectURL(file);
  stage.classList.add('active');
  statusText.textContent = 'PROCESSING — waiting for first caption…';

  const form = new FormData();
  form.append('file', file);
  form.append('source_lang', sourceLang.value);
  form.append('target_lang', targetLang.value);
  form.append('translate', translateToggle.checked);

  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    if (!res.ok) throw new Error('Upload failed: ' + res.status);
    const { session_id } = await res.json();
    connectSocket(session_id);
  } catch (err) {
    errorBox.textContent = '⚠️ ' + err.message;
    statusText.textContent = 'UPLOAD FAILED';
  }
});

function connectSocket(sessionId){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}`);

  ws.onopen = () => { statusText.textContent = 'PROCESSING — captions filling in…'; };

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.done) {
      done = true;
      statusDot.classList.add('done');
      statusText.textContent = 'DONE — full transcript ready';
      return;
    }
    captions.push(msg);
    bufferedUntil = Math.max(bufferedUntil, msg.end);
    addLogEntry(msg);
    updateRuler();

    if (!hasStartedPlayback) {
      hasStartedPlayback = true;
      statusText.textContent = 'PROCESSING — captions filling in…';
      video.play().catch(()=>{});
    } else if (autoPaused && video.currentTime < bufferedUntil - 0.15) {
      autoPaused = false;
      statusText.textContent = 'PROCESSING — captions filling in…';
      video.play().catch(()=>{});
    }
  };

  ws.onerror = () => { errorBox.textContent = '⚠️ Connection to the caption stream dropped.'; };
  ws.onclose = () => { if (!done) statusText.textContent = 'DISCONNECTED'; };
}
</script>
</body>
</html>
